name: Nightly API Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    # This block replaces the manual "Workflow permissions" settings
    permissions:
      contents: write
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install pandas requests
        
      - name: Run Sync Script
        env:
          API_USER: ${{ secrets.API_USER }}
          API_PASS: ${{ secrets.API_PASS }}
        run: python sync.py
        
      - name: Commit and Push CSV
        run: |
          git config --global user.name 'Sync Bot'
          git config --global user.email 'bot@github.com'
          git add expiry_data.csv || echo "No changes to add"
          git commit -m "Nightly data sync update" || echo "Nothing to commit"
          git push

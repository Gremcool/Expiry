name: Nightly API Sync

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at midnight UTC
  workflow_dispatch:      # Allows you to trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    # CRITICAL: This allows the bot to push the generated JSON files back to your repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run Sync Script
        env:
          API_USER: ${{ secrets.API_USER }}
          API_PASS: ${{ secrets.API_PASS }}
        run: python sync.py
        
      - name: Commit and Push Raw Data
        run: |
          git config --global user.name 'Sync Bot'
          git config --global user.email 'bot@github.com'
          
          # This adds the entire data folder (raw_grn.json and raw_materials.json)
          # and ensures your manually managed Branch.csv is included.
          git add data/*.json Branch.csv || echo "No data files found to add"
          
          # Using '|| echo' prevents the action from failing if the data hasn't changed
          git commit -m "Sync: Raw GRN (with Material/Batch) and Materials Master" || echo "Nothing to commit"
          
          git push

name: Nightly API Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install pandas requests
        
      - name: Run Sync Script
        env:
          API_USER: ${{ secrets.API_USER }}
          API_PASS: ${{ secrets.API_PASS }}
        run: python sync.py
        
      - name: Commit and Push Dumps
        run: |
          git config --global user.name 'Sync Bot'
          git config --global user.email 'bot@github.com'
          
          # Add the new JSON data folder and any existing CSVs
          git add data/*.json Branch.csv expiry_data.csv || echo "No changes to add"
          
          # Commit only if there are changes to avoid failing the workflow
          git commit -m "Nightly Dashboard Dump: GRN, Materials, and Branch" || echo "Nothing to commit"
          
          git push

name: Nightly API Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # CRITICAL for updating the data folder
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run Sync Script
        env:
          API_USER: ${{ secrets.API_USER }}
          API_PASS: ${{ secrets.API_PASS }}
        run: python sync.py
        
      - name: Commit and Push
        run: |
          git config --global user.name 'Sync Bot'
          git config --global user.email 'bot@github.com'
          git add data/raw_grn.json data/raw_materials.json Branch.csv
          # This commit message will show up on the data folder when it works
          git commit -m "Sync: Raw Dumps with Material and Batch fields" || echo "No changes"
          git push

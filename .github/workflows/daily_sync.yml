name: Nightly API Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      # Install only what we need
      - name: Install dependencies
        run: pip install requests
        
      - name: Run Sync Script
        env:
          API_USER: ${{ secrets.API_USER }}
          API_PASS: ${{ secrets.API_PASS }}
        run: python sync.py
        
      - name: Commit and Push Dumps
        run: |
          git config --global user.name 'Sync Bot'
          git config --global user.email 'bot@github.com'
          
          # Add the whole data folder
          git add data/*.json Branch.csv || echo "No changes to add"
          
          git commit -m "Sync: GRN includes Material/Batch and numerical join_id" || echo "Nothing to commit"
          
          git push

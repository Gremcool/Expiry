name: Nightly API Sync

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at 00:00 UTC
  workflow_dispatch:      # Allows manual trigger via the "Actions" tab

jobs:
  build:
    runs-on: ubuntu-latest
    # REQUIRED: Allows the script to push updated JSON files back to the repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run Sync Script
        env:
          API_USER: ${{ secrets.API_USER }}
          API_PASS: ${{ secrets.API_PASS }}
        run: python sync.py
        
      - name: Commit and Push
        run: |
          git config --global user.name 'Sync Bot'
          git config --global user.email 'bot@github.com'
          
          # Force track the JSON dumps and your Branch mapping
          git add data/raw_grn.json data/raw_materials.json Branch.csv
          
          # Commit will only happen if data has actually changed
          git commit -m "Sync: Raw Dumps with Material and Batch fields" || echo "No changes detected"
          
          git push
